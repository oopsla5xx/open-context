name: validate example context

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - 'tests/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install open-context
        run: pip install -e .

      - name: Validate example context.yaml (phrasing + amplification)
        run: |
          open-context validate \
            --context examples/rails-hmvc-sample/context.yaml \
            --tests   examples/rails-hmvc-sample/tests/ \
            --repo    examples/rails-hmvc-sample/

      - name: Validate example architecture rules
        run: |
          open-context architecture validate \
            --repo examples/rails-hmvc-sample/
