name: validate example context

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/validate-example.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/validate-example.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install open-context
        run: pip install -e .

      - name: Validate rails-hmvc-sample context.yaml (phrasing + amplification)
        run: |
          open-context validate \
            --context examples/rails-hmvc-sample/context.yaml \
            --tests   examples/rails-hmvc-sample/tests/ \
            --repo    examples/rails-hmvc-sample/

      - name: Validate nextjs-sample context.yaml (phrasing + amplification)
        run: |
          open-context validate \
            --context examples/nextjs-sample/context.yaml \
            --tests   examples/nextjs-sample/tests/ \
            --repo    examples/nextjs-sample/

      - name: Validate data-pipeline-sample context.yaml (phrasing + amplification)
        run: |
          open-context validate \
            --context examples/data-pipeline-sample/context.yaml \
            --tests   examples/data-pipeline-sample/tests/ \
            --repo    examples/data-pipeline-sample/
