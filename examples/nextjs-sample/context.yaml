---
# Open:Context — Example Context Model
# Domain: Task Tracker SaaS (Next.js App Router / Server Actions sample)
# Purpose: Benchmark the resolver on a second framework (docs/nextjs-effectiveness-report.md).
# Generated by /oc-setup against a real, buildable skeleton in .tmp-nextjs-sample/
# (disposable — deleted after benchmarking; this file + tests/ are the retained artifact).
# Not real production data — replace with your own project details.

# ══════════════════════════════════════════════════════════════════════════════
# L1 — STACK
# ══════════════════════════════════════════════════════════════════════════════

project:
  name: task-tracker-nextjs
  language: typescript
  language_version: "5"
  framework: nextjs
  framework_version: "16.3.1"
  api_mode: false
  api_versioning: none          # no REST API layer — mutations go through Server Actions
  default_actor: member         # fallback when no domain matched

# ══════════════════════════════════════════════════════════════════════════════
# L2 — ARCHITECTURE
# ══════════════════════════════════════════════════════════════════════════════

architecture:
  name: server-actions
  flow: [server_action, validation, service, model]

components:
  # ── server_action ────────────────────────────────────────────────────────────
  server_action:
    responsibility:
      - request_entry
      - form_or_event_binding
      - auth_and_actor_check
    allowed_dependencies:
      - validation
      - service
    forbidden_dependencies:
      - model     # no direct Prisma calls from the action
    patterns:
      - id: use_server_directive
        description: File starts with 'use server'; every export is invoked via a form action, formAction prop, or client event handler.
      - id: validate_before_service
        description: Parse input through the domain's Zod schema before calling any service function.

  # ── validation ────────────────────────────────────────────────────────────────
  validation:
    responsibility:
      - input_shape_validation
    allowed_dependencies: []
    forbidden_dependencies:
      - model
      - service
    patterns:
      - id: zod_schema_only
        description: Zod schemas validate shape only — no side effects, no DB calls, no auth checks.

  # ── service ───────────────────────────────────────────────────────────────────
  service:
    responsibility:
      - business_logic
      - prisma_calls
      - transaction_boundaries
    allowed_dependencies:
      - model
    forbidden_dependencies:
      - server_action
    patterns:
      - id: service_owns_prisma
        description: Server Actions never call prisma.* directly — all persistence goes through a service function.

  # ── model ──────────────────────────────────────────────────────────────
  # Named 'model' again as of resolver.py's component_reason() fix — it
  # used to be named 'prisma_model' to dodge a hardcoded Rails-flavored
  # description keyed on the literal string "model" (referenced
  # ApplicationForm/attr_reader). component_reason() is now data-driven,
  # reading responsibility/patterns straight from this block, so the
  # collision no longer exists. See docs/nextjs-effectiveness-report.md.
  model:
    responsibility:
      - schema_definition
      - persistence
    location: prisma/schema.prisma
    allowed_dependencies: []
    forbidden_dependencies:
      - server_action
      - validation
      - service

# ── actors ──────────────────────────────────────────────────────────────────────
actors:
  owner:
    description: Team/project owner — full control, including destructive and billing-plan actions
    context_keys: [actorRole]

  member:
    description: Regular team member — can create and manage projects/tasks; no billing or destructive project actions
    context_keys: [actorRole]

  guest:
    description: Read-only / unauthenticated-adjacent access — no mutations
    context_keys: [actorRole]

# ══════════════════════════════════════════════════════════════════════════════
# L3 — DOMAINS
# ══════════════════════════════════════════════════════════════════════════════

domains:
  - name: project_management
    coverage_level: routing_only
    keywords: [project, projects, workspace, rename, archive, delete_project, create_project, portfolio]
    typical_actors: [owner, member]

  - name: task_management
    coverage_level: file_indexed
    keywords: [task, tasks, kanban, assign, assignment, reorder, board, column, backlog]
    typical_actors: [owner, member]
    related_components:
      - "app/projects/[id]/tasks/actions.ts"
      - lib/services/task-service.ts
      - prisma/schema.prisma
    subtypes:
      - name: task_assignment
        keywords: [assign, assignment, assignee, reassign, unassigned]
        related_components:
          - "app/projects/[id]/tasks/actions.ts"
          - lib/services/task-service.ts
      - name: task_reordering
        keywords: [reorder, kanban, move, drag, column, backlog]
        related_components:
          - "app/projects/[id]/tasks/actions.ts"
          - lib/services/task-service.ts
        patterns:
          - id: atomic_reorder_shift
            description: >
              Moving a task between columns must shift sibling `order` values
              inside a single prisma.$transaction. Updating the moved task's
              order alone lets two concurrent drags collide on the same value.

  - name: team_billing
    coverage_level: pattern_indexed
    keywords: [billing, plan, subscription, usage, invoice, stripe, webhook, upgrade, downgrade]
    typical_actors: [owner]
    extra_components: [route_handler]
    extra_component_reasons:
      route_handler: >
        Stripe delivers usage events via webhook POST, not through a
        user-invoked Server Action. app/api/webhooks/stripe/route.ts is a
        Route Handler — the correct Next.js primitive for an inbound
        integration endpoint that isn't triggered by a form or UI action.
    related_components:
      - app/billing/actions.ts
      - app/api/webhooks/stripe/route.ts
      - lib/services/billing-service.ts
      - lib/actor.ts
      - prisma/schema.prisma
    patterns:
      - id: atomic_usage_limit_check
        description: >
          Checking usageCount < usageLimit and then incrementing it as two
          separate statements is a TOCTOU race — two concurrent webhook
          deliveries can both pass the check and push the team over its
          limit. Fold the check into the WHERE clause of a single UPDATE
          (prisma.$executeRaw) so the database decides atomically.
      - id: owner_only_plan_change
        description: >
          Changing a team's billing plan is owner-only. Every Server Action
          that mutates TeamBilling must call requireOwner(actorRole) from
          lib/actor.ts before touching the service layer — framework-level
          CSRF checks are not an authorization boundary.

# ══════════════════════════════════════════════════════════════════════════════
# L4 — INVARIANTS
# ══════════════════════════════════════════════════════════════════════════════

rules:
  - id: rule-01-service-owns-prisma
    description: Server Actions must not call prisma.* directly. All persistence delegated to a service function.
    applies_to: [server_action]
    severity: critical

  - id: rule-02-validate-before-service
    description: Every Server Action must parse its input through the domain's Zod schema before calling the service layer.
    applies_to: [server_action, validation]
    severity: critical

  - id: rule-03-transactional-reorder
    description: >
      task_management reorder actions must wrap the sibling-order shift and
      the moved task's update in a single prisma.$transaction.
    applies_to: [service]
    domain: [task_management]
    severity: critical

  - id: rule-04-atomic-usage-check
    description: >
      Usage-limit check-and-increment for TeamBilling must be one atomic SQL
      statement (limit check inside the WHERE clause), never a separate
      SELECT-then-UPDATE.
    applies_to: [service]
    domain: [team_billing]
    severity: critical
    guidance: |
      await prisma.$executeRaw`
        UPDATE TeamBilling
        SET usageCount = usageCount + ${amount}
        WHERE teamId = ${teamId}
          AND usageCount + ${amount} <= usageLimit
      `

  - id: rule-05-owner-only-billing-actions
    description: Actions that mutate TeamBilling (plan changes) must call requireOwner(actorRole) before invoking the service layer.
    applies_to: [server_action]
    domain: [team_billing]
    severity: critical

  - id: rule-06-revalidate-after-mutation
    description: >
      Every Server Action that mutates data must call revalidatePath (or
      another cache-invalidation primitive) before returning, so the UI
      reflects the change in the same round trip.
    applies_to: [server_action]
    severity: warning
