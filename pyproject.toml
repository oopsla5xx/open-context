[build-system]
requires = ["setuptools>=40", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-context"
version = "0.1.0"
description = "Zero-LLM context resolver for Rails HMVC codebases"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
open-context = "open_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.main]
ignore-paths = ["vendor"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "wrong-import-position",   # hook scripts must insert sys.path before imports
    "invalid-name",            # module-level vars in scripts misidentified as constants
    "too-many-branches",       # schema.py validate() has intentionally many branches
    "too-many-locals",         # validator.py run_phrasing_tests has intentionally many locals
    "too-many-statements",     # cli.py subcommand handlers are intentionally dense
]
